name: Server protocol reference tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server-contract.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server-contract.yml']
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: node --test server/*.test.mjs
