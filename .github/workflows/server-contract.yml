name: Server protocol reference tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', 'supabase/**', 'netlify/**', 'integration-drafts/**', 'netlify.toml', 'package.json', 'package-lock.json', '.github/workflows/server-contract.yml']
  pull_request:
    paths: ['server/**', 'supabase/**', 'netlify/**', 'integration-drafts/**', 'netlify.toml', 'package.json', 'package-lock.json', '.github/workflows/server-contract.yml']
permissions:
  contents: read
jobs:
  protocol:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix server --ignore-scripts
      - run: node --test server/*.test.mjs
      - name: Check local operational drill syntax
        run: |
          node --check server/scripts/check-local-capacity.mjs
          node --check server/scripts/check-local-backup-restore.mjs

  netlify-bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --ignore-scripts
      - run: npm run check:netlify
      - run: npm run test:netlify-bundle
      - name: Build and verify the uninstalled Ops review function
        run: npm run build:ops-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: ops-schedule-bridge-review
          path: .local-backend/ops-schedule-bridge-draft/
      - name: Real browser account and administration request origins
        run: node server/scripts/check-browser-origin-ci.mjs
      - name: Real browser account and report interactions
        run: npm run test:portal-browser

  postgres-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: mercury-ci-only
        ports:
          - 55322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - run: npm ci --prefix server --ignore-scripts
      - run: node server/scripts/check-local-postgres-limiter.mjs
        env:
          CI: 'true'
          MERCURY_POSTGRES_TEST_URL: postgres://postgres:mercury-ci-only@127.0.0.1:55322/postgres
          MERCURY_BOOTSTRAP_TEST_ROLES: '1'
