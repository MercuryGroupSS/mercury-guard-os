name: Android APK and tests
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests, lint, APK and device test APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify APK signature and record checksum
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MercuryGuardOS-test-apk
          path: app/build/outputs/apk/debug/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: |
            app/build/reports/
            app/build/test-results/
  device-tests:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [28, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          disable-animations: true
          # Suppress only the emulator's first-use fullscreen tutorial, which steals window focus.
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed
            gradle --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
  https-integration:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: bash server/scripts/run-https-android-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: https-android-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
  location-https-integration:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install pinned local backend dependencies
        run: npm ci --prefix server
      - name: Start fresh isolated local Auth and PostgreSQL
        run: |
          umask 077
          mkdir -p .local-backend
          if [ -n "$(docker ps -a --filter name=mercury-guard-os-local --format '{{.Names}}')" ]; then
            echo 'An existing Guard stack requires its owner; CI will not reuse or stop it.'
            exit 1
          fi
          echo 'MERCURY_LOCATION_CI_STACK_OWNED=true' >> "$GITHUB_ENV"
          if ! MERCURY_DOCKER_BIN="$(command -v docker)" node server/scripts/start-local-stack.mjs > .local-backend/location-ci-stack.log 2>&1; then
            echo 'Isolated local stack startup failed; private runtime output is not published.'
            exit 1
          fi
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Location consent and typed transport (SDK GNSS unverified)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          script: node server/scripts/run-location-https-android-test.mjs
      - name: Stop only the CI-owned Guard stack, preserving volumes
        if: always() && env.MERCURY_LOCATION_CI_STACK_OWNED == 'true'
        run: |
          umask 077
          if ! server/node_modules/.bin/supabase stop --project-id mercury-guard-os-local --workdir "$GITHUB_WORKSPACE" > .local-backend/location-ci-stop.log 2>&1; then
            echo 'CI-owned Guard stack stop was unconfirmed; private runtime output is not published.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: location-typed-acceptance-summary
          # Contains only the fixed test/mode/status summary; never upload runtime keys or raw fixture logs.
          path: app/build/reports/location-acceptance/result.json
          if-no-files-found: warn

  signin-https-integration:
    # This isolated job builds its own fixture APK; start it alongside the ordinary build.
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install pinned local backend dependencies
        run: npm ci --prefix server
      - name: Start fresh isolated local Auth and PostgreSQL
        run: |
          umask 077
          mkdir -p .local-backend
          if [ -n "$(docker ps -a --filter name=mercury-guard-os-local --format '{{.Names}}')" ]; then
            echo 'An existing Guard stack requires its owner; CI will not reuse or stop it.'
            exit 1
          fi
          echo 'MERCURY_SIGNIN_CI_STACK_OWNED=true' >> "$GITHUB_ENV"
          if ! MERCURY_DOCKER_BIN="$(command -v docker)" node server/scripts/start-local-stack.mjs > .local-backend/signin-ci-stack.log 2>&1; then
            echo 'Isolated local stack startup failed; private runtime output is not published.'
            exit 1
          fi
      - name: Actual local Auth administrator logout race and exact cleanup
        env:
          MERCURY_CONFIGURED_REAL_AUTH: synthetic-only
        run: |
          mkdir -p app/build/reports/readiness
          node server/scripts/check-configured-real-auth.mjs > app/build/reports/readiness/configured-real-auth-result.json
      - name: Actual local schedule bridge, Auth, cancellation and owned cleanup
        run: |
          mkdir -p app/build/reports/readiness
          MERCURY_DOCKER_BIN="$(command -v docker)" node server/scripts/check-local-ops-bridge.mjs > app/build/reports/readiness/ops-schedule-bridge.log
      - name: Verify Guard logical restore and bounded handler outcomes
        run: |
          mkdir -p app/build/reports/readiness
          node server/scripts/check-local-backup-restore.mjs > app/build/reports/readiness/restore-result.json
          node server/scripts/check-local-capacity.mjs > app/build/reports/readiness/capacity-result.json
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Actual platform biometric and individual sign-in
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          # Match the Settings enrollment path proved locally; the action defaults to AOSP.
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: node server/scripts/run-signin-https-android-test.mjs
      - name: Stop only the CI-owned Guard stack, preserving volumes
        if: always() && env.MERCURY_SIGNIN_CI_STACK_OWNED == 'true'
        run: |
          umask 077
          if ! server/node_modules/.bin/supabase stop --project-id mercury-guard-os-local --workdir "$GITHUB_WORKSPACE" > .local-backend/signin-ci-stop.log 2>&1; then
            echo 'CI-owned Guard stack stop was unconfirmed; private runtime output is not published.'
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signin-platform-acceptance-summary
          # Contains only the fixed test/status/cleanup summary; never upload runtime keys or raw fixture logs.
          path: |
            app/build/reports/signin-acceptance/result.json
            app/build/reports/readiness/restore-result.json
            app/build/reports/readiness/configured-real-auth-result.json
            app/build/reports/readiness/capacity-result.json
          if-no-files-found: warn
